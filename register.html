<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registrarse - Imperium Galahad</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>REGISTRARSE</h1>
    <p><a href="index.html">← Volver a la Página Principal</a></p>

    <label for="reg-nombre">Nombre:</label>
    <input id="reg-nombre" type="text" placeholder="Escribe tu nombre">
    <br>

    <label for="reg-correo">Correo electrónico:</label>
    <input id="reg-correo" type="email" placeholder="Escribe tu correo">
    <br>

    <label for="reg-password">Contraseña:</label>
    <input id="reg-password" type="password" placeholder="Crea tu contraseña">
    <br>

    <label for="reg-ciudad">Ciudad:</label>
    <input id="reg-ciudad" type="text" placeholder="Escribe tu ciudad">
    <br>

    <button type="button">Registrarse</button>

    <p>¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>

</body>
</html>
